name: Scheduled Content Sync

on:
  schedule:
    - cron: "0 */3 * * *" # Every 3 hours
  workflow_dispatch:

# One at a time. Two overlapping runs would ingest the same feeds into the
# same files and race each other to push.
concurrency:
  group: content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Ingest only. This job does not build.
      #
      # It used to: it ran the whole build every three hours and then threw
      # the output away, because dist was never uploaded anywhere. Cloudflare
      # builds and deploys from the push, so building here would render every
      # page and every Open Graph image a second time to no purpose.
      - name: Ingest feeds
        run: bun run sync

      # The push is the deploy. Nothing else here talks to Cloudflare.
      #
      # These commits used to carry [skip ci], which Cloudflare honours, so
      # every automated run was skipped and the site went unpublished from
      # 4 May to 29 September while all of them reported success. The marker
      # is gone, deliberately, and must not come back.
      - name: Commit and push new content
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "content: automated feed sync"
            git push origin main
          else
            echo "Nothing new in any feed."
          fi

      # Last, so one dead feed cannot stop everything else being published
      # and cannot pass quietly either.
      - name: Report any feed failures
        run: bun run report-ingest
